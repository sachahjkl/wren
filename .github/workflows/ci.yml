name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      - name: Build (release)
        shell: cmd
        run: call build.bat

      - name: Tests (tools\test_all.ps1 -CI)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_all.ps1 -CI

      # what the JavaScript conformance steps of test_all measured (WPT sample per folder, test262 failures)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-conformance-${{ github.sha }}
          path: |
            build/wpt/report.md
            build/wpt/results.txt
            build/test262/wasm_errors.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Package (smoke test of tools\package.ps1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: wren-windows-x64-${{ github.sha }}
          path: build/dist/*.zip
          retention-days: 14
