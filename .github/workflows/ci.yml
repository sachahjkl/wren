name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A few seconds: every fragment of changelog.d is well formed and none was already released (CONTRIBUTING.md); then the
      # script's own tests.
      - name: CHANGELOG fragments (tools\changelog.ps1 -Check)
        run: |
          ./tools/changelog.ps1 -Check
          if ($LASTEXITCODE) { exit 1 }
          ./tools/changelog_test.ps1
          if ($LASTEXITCODE) { exit 1 }

      - uses: ./.github/actions/setup

      # The build takes one to two minutes here (dependencies from the caches). A build that runs for 20 minutes is a defect (a local
      # render.Surface in window_open once kept the -o:speed -debug codegen of one module going past the job's 90 minutes): it fails.
      - name: Build (optimized, development channel)
        timeout-minutes: 20
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmd /c build.bat
          $code = $LASTEXITCODE
          "build.bat took {0:N0} s" -f $sw.Elapsed.TotalSeconds
          exit $code

      # Two steps of test_all at a time (-Jobs 0 is two under -CI; the end-to-end timeouts of -CI are three times the usual). Measured on this runner
      # (4 vCPU) with the same steps: two at a time 514 s; three 539 s with three checks failing under the load; four 765 s, the sum of the steps'
      # durations doubled (1 280 s to 2 580 s): the steps compile and test, they do not wait, and they slow each other down on four cores. The checks
      # that failed under three (the wasm preemption tick count, a 50 000 element innerHTML under its 20 s limit, a font edge of canvas2d) are not run
      # here any more or read a stronger pixel; one that fails again under the load depends on the machine's speed and goes behind -Perf. The AddressSanitizer unit tests
      # are the long step (six minutes one package after the other): the `asan` job below runs them beside this one, three packages at a time.
      # The tests that measure time are not run here (the runner's speed is unknown): `test_all.ps1 -Perf` is for our own machines, and is ignored when CI is set.
      - name: Tests (tools\test_all.ps1 -CI -NoAsan)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_all.ps1 -CI -NoAsan

      # what the JavaScript conformance steps of test_all measured (WPT sample per folder, test262 failures)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-conformance-${{ github.sha }}
          path: |
            build/wpt/report.md
            build/wpt/results.txt
            build/test262/wasm_errors.txt
          if-no-files-found: ignore
          retention-days: 14

      # what the memory checks of test_all found (the check build's leak reports, the endurance curves)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-checks-${{ github.sha }}
          path: |
            build/memcheck/*/profile/memtrack.txt
            build/endurance/stats.csv
            build/endurance/endurance.svg
            build/endurance/endurance/profile/memtrack.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Package (smoke test of tools\package.ps1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Dev -Extras

      - uses: actions/upload-artifact@v4
        with:
          name: wren-windows-x64-${{ github.sha }}
          path: build/dist/*.zip
          retention-days: 14

      # the build's map (tools\symbols.ps1): names the frames of its crash reports (tools\crash_symbolize.ps1); not in the package
      - uses: actions/upload-artifact@v4
        with:
          name: wren-symbols-${{ github.sha }}
          path: build/dist/symbols/*.map
          retention-days: 14

  # The unit tests of every package under AddressSanitizer (tools\asan.ps1): what test_all -CI runs without -NoAsan. A job of its own, so that
  # the wall clock of a run is the longer of the two, not their sum. It builds the browser's dependencies as the first job does (the caches
  # are shared: the second to start restores what the first saved, or builds the same), because asan.ps1 reads the libraries the browser links.
  asan:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      - name: Build (the dependencies, and the program the libraries are read from)
        timeout-minutes: 20
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmd /c build.bat
          $code = $LASTEXITCODE
          "build.bat took {0:N0} s" -f $sw.Elapsed.TotalSeconds
          exit $code

      - name: Unit tests under AddressSanitizer (tools\asan.ps1 -Jobs 3)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\asan.ps1 -Jobs 3

  # The packages that are portable already (docs/portability.md): odin check for Linux and their unit tests, without a
  # window. Every download pinned as on Windows: Odin by SHA-256 here, Wasmtime in tools/fetch_wasmtime.sh, crates by
  # Cargo.lock (--locked), Rust by version.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Odin dev-2026-10, clang, NASM
        env:
          ODIN_TAG: dev-2026-10
          ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld nasm
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-linux-amd64-$ODIN_TAG.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -maxdepth 2 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Cache the Rust library and its compiled crates
        uses: actions/cache@v4
        with:
          path: |
            build/native-linux
            ~/.cargo/registry
          key: native-linux-rust1.99.1-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/**/*.rs', 'native/**/Cargo.toml', 'tools/build_native.sh') }}
          restore-keys: native-linux-rust1.99.1-${{ hashFiles('native/Cargo.lock') }}-

      - name: Native libraries (Wasmtime, Lexbor, the Rust library)
        run: |
          tools/fetch_wasmtime.sh
          CC=clang tools/build_lexbor.sh
          tools/build_native.sh --profile quick

      - name: odin check and unit tests (tools/linux_ci.sh)
        run: tools/linux_ci.sh odin