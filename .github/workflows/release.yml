name: Release

# A version tag vX.Y.Z (annotated: git tag -a vX.Y.Z -m "Wren X.Y.Z") builds the release package and publishes it.
# The tag must match APP_VERSION of src/browser/about.odin, and CHANGELOG.md must have its section, assembled from changelog.d
# (tools/changelog.ps1 -Assemble -Version X.Y.Z, which writes APP_VERSION too; CONTRIBUTING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # the release notes are made from the history since the previous tag

      - uses: ./.github/actions/setup
        with:
          native-profile: release   # build.bat release: the Rust library with fat LTO

      - name: Check the version
        id: version
        run: |
          $tag = '${{ github.ref_name }}'
          $m = Select-String -Path src\browser\about.odin -Pattern 'APP_VERSION\s*::\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ("v$v" -ne $tag) { throw "tag $tag does not match APP_VERSION $v (src/browser/about.odin)" }
          # the CHANGELOG was assembled for this version (tools/changelog.ps1 -Assemble -Version): its section, no fragment left
          ./tools/changelog.ps1 -Check -Release $v
          if ($LASTEXITCODE) { throw "CHANGELOG.md is not ready for $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # No test run here: the CI of master is the gate (a release is tagged on a commit it passed). What is published is built, and the
      # remote-control suite (navigation, scripts, input, captures, text and images on screen) runs against that very exe before it is
      # packed.
      - name: Build (release)
        shell: cmd
        run: call build.bat release

      - name: The release exe end to end (src\tools\e2e\remote_channel.odin, remote_state.odin, on build\wren.exe)
        run: |
          Push-Location tools\testserver; go build -o ..\..\build\testserver.exe .; Pop-Location
          odin build src/tools/e2e -build-mode:test -out:build/e2e_test.exe -o:speed -debug -use-separate-modules -collection:toolkit=ext/gui_toolkit -collection:wb=src -define:FONT_BACKEND=native -define:FONT_NATIVE_LINK=false -define:A11Y_ACCESSKIT=true -define:A11Y_NATIVE_LINK=false -define:WREN_CHANNEL=dev -define:DEFAULT_TEMP_ALLOCATOR_BACKING_SIZE=1048576 -define:ODIN_TEST_THREADS=1 -define:ODIN_TEST_FANCY=false -extra-linker-flags:"/STACK:33554432 /NODEFAULTLIB:vcruntime.lib /DEFAULTLIB:libvcruntime.lib"
          if ($LASTEXITCODE) { exit 1 }
          . .\tools\test_env.ps1
          foreach ($s in 'remote_channel', 'remote_state') { Invoke-WrenE2E 'build\e2e_test.exe' $s; if ($LASTEXITCODE) { exit 1 } }
      - name: Package
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Version ${{ steps.version.outputs.version }} || exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\release_notes.ps1 -Tag ${{ github.ref_name }} -Out build\dist\NOTES.md || exit /b 1

      # the release's map (tools\symbols.ps1): not published with it; tools\crash_symbolize.ps1 names the frames of its crash
      # reports with it. Kept as long as GitHub keeps an artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: wren-${{ steps.version.outputs.version }}-symbols
          path: build/dist/symbols/*.map
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          gh release create $tag "build/dist/wren-$v-windows-x64.exe" build/dist/SHA256SUMS.txt --title "Wren $v" --notes-file build/dist/NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }


  # The Linux file, added to the release the job above published: a failure here leaves the Windows release standing.
  linux:
    needs: release
    uses: ./.github/workflows/linux-package.yml
    with:
      version: ${{ needs.release.outputs.version }}

  publish-linux:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wren-linux-x64
          path: dist
      - name: Add the Linux file to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS-linux.txt --repo "${{ github.repository }}"
