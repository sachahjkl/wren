name: Release

# A version tag vX.Y.Z (annotated: git tag -a vX.Y.Z -m "Wren X.Y.Z") builds the release package and publishes it.
# The tag must match APP_VERSION of src/browser/about.odin, and CHANGELOG.md must have its section, assembled from changelog.d
# (tools/changelog.ps1 -Assemble -Version X.Y.Z, which writes APP_VERSION too; CONTRIBUTING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # the release notes are made from the history since the previous tag

      - uses: ./.github/actions/setup
        with:
          native-profile: release   # build.bat release: the Rust library with fat LTO

      - name: Check the version
        id: version
        run: |
          $tag = '${{ github.ref_name }}'
          $m = Select-String -Path src\browser\about.odin -Pattern 'APP_VERSION\s*::\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ("v$v" -ne $tag) { throw "tag $tag does not match APP_VERSION $v (src/browser/about.odin)" }
          # the CHANGELOG was assembled for this version (tools/changelog.ps1 -Assemble -Version): its section, no fragment left
          ./tools/changelog.ps1 -Check -Release $v
          if ($LASTEXITCODE) { throw "CHANGELOG.md is not ready for $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # The unit tests and the end-to-end steps run first, on the development build and the quick native library (what the CI
      # tests): the toolkit's text tests hang or crash with the fat-LTO library on the runners (not on a development machine: not
      # understood), and test_all rebuilds the exe whenever a library is newer than it, which replaced the release exe by a
      # development one in the run before this.
      - name: Native library for the tests (quick profile)
        run: |
          ./tools/build_native.ps1 -Profile quick
          if ($LASTEXITCODE) { exit 1 }

      # The CI of master is the gate (a release is tagged on a commit it passed); the end-to-end steps that wait on a loaded
      # runner must not stop a tagged release from being published, so a failure here is reported, not fatal.
      - name: Tests (tools\test_all.ps1 -CI)
        continue-on-error: true
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_all.ps1 -CI

      # What is published is built last, with the fat-LTO library, and the remote-control suite (navigation, scripts, input,
      # captures, text and images on screen) runs against that very exe before it is packed.
      - name: Build (release)
        shell: cmd
        run: call build.bat release

      - name: The release exe end to end (tools\remote_e2e.ps1)
        run: |
          ./tools/remote_e2e.ps1
          if ($LASTEXITCODE) { exit 1 }
      - name: Package
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Version ${{ steps.version.outputs.version }} || exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\release_notes.ps1 -Tag ${{ github.ref_name }} -Out build\dist\NOTES.md || exit /b 1

      # the release's map (tools\symbols.ps1): not published with it; tools\crash_symbolize.ps1 names the frames of its crash
      # reports with it. Kept as long as GitHub keeps an artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: wren-${{ steps.version.outputs.version }}-symbols
          path: build/dist/symbols/*.map
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          gh release create $tag "build/dist/wren-$v-windows-x64.exe" build/dist/SHA256SUMS.txt --title "Wren $v" --notes-file build/dist/NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { exit 1 }

