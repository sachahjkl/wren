# Publishes site/ (plain HTML and CSS, no build step) to GitHub Pages: https://sachahjkl.github.io/wren/
# Pages must use the "GitHub Actions" source, set once per repository:
#   gh api -X POST repos/sachahjkl/wren/pages -f build_type=workflow
# (or Settings > Pages > Build and deployment > Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "src/tools/wrentool/gen/site_meta.odin"
      - "ext/gui_toolkit"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    container: debian:bookworm   # (deb.debian.org, not the runner's Ubuntu mirrors)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Debian's packages
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl clang lld zstd >/dev/null
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: git submodule update --init ext/gui_toolkit
      # what each page says when shared, the feed, the sitemap: wrentool site_meta (Odin, the same pinned archive as the toolkit's)
      - name: Odin dev-2026-11a
        env:
          ODIN_TAG: dev-2026-11a
          ODIN_SHA256: 65c9f6e97d6f8a30930e151f270ce5aeaa98fe8b2ba49fe067394e2af04f7618
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-linux-amd64-$ODIN_TAG.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"
      - run: mkdir -p build && odin run src/tools/wrentool -collection:wb=src -out:build/wrentool -- site_meta site _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
