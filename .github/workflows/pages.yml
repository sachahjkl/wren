# Publishes site/ (plain HTML and CSS, no build step) to GitHub Pages: https://sachahjkl.github.io/wren/
# Pages must use the "GitHub Actions" source, set once per repository:
#   gh api -X POST repos/sachahjkl/wren/pages -f build_type=workflow
# (or Settings > Pages > Build and deployment > Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
