name: Linux package

# The Linux release file (wrentool package), built and started on a machine with nothing of Wren's on it. The release workflow calls
# this; run it by hand (Actions, or gh workflow run linux-package.yml) to check a commit before tagging it. The engine's image (wren_js.wasm)
# is portable and only the Windows toolchain builds it: the first job makes it for the second.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false

jobs:
  js-image:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: The JavaScript engine's image
        run: |
          odin run src/tools/buildjs -collection:wb=src -out:build/buildjs.exe
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: wren-js-image
          path: build/js/wren_js.wasm
          if-no-files-found: error
          retention-days: 3

  package:
    needs: js-image
    # the executable runs on a glibc at least as new as this container's, 2.36 (Debian 12; clang 18 from LLVM's packages: see below)
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 45
    steps:
      # Debian 12 (bookworm): its packages from deb.debian.org, not from the runner's Ubuntu mirrors (their DNS failed for hours),
      # and its glibc 2.36: the oldest the Linux build then needs. Its clang 14 stops on the Wasmtime release ("LLVM ERROR:
      # Invalid encoding"): clang, lld and wasm-ld 18 from LLVM's own packages for bookworm (apt.llvm.org). First: checkout
      # needs git for the submodules.
      - name: Debian's packages, LLVM 18
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl jq xz-utils zstd unzip nasm pkg-config libasound2-dev libopus-dev libfontconfig1-dev xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libxkbcommon0 libwayland-client0 >/dev/null
          curl -fsSL --retry 5 --retry-all-errors https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-18 main" > /etc/apt/sources.list.d/llvm.list
          apt-get update -qq && apt-get install -y -qq --no-install-recommends clang-18 lld-18 >/dev/null
          for t in clang clang++ ld.lld lld wasm-ld llvm-ar; do ln -sf "/usr/bin/$t-18" "/usr/local/bin/$t"; done
          ln -sf /usr/bin/clang-18 /usr/local/bin/cc; ln -sf /usr/bin/clang++-18 /usr/local/bin/c++   # (what cargo's build scripts call)

      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: wren-js-image
          path: build/js

      - name: Odin dev-2026-11a
        env:
          ODIN_TAG: dev-2026-11a
          ODIN_SHA256: 65c9f6e97d6f8a30930e151f270ce5aeaa98fe8b2ba49fe067394e2af04f7618
        run: |
          # (tried again on an error of the network or of GitHub, a 504 at times: the digest below says whether what came is the archive)
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-linux-amd64-$ODIN_TAG.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -maxdepth 2 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: Rust 1.99.1
        run: |
          # (rustup itself: the container has none; its homes named, in a container $HOME is not the user's)
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"; echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain 1.99.1
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Native libraries
        run: |
          mkdir -p build
          odin build src/tools/wrentool -collection:wb=src -out:build/wrentool
          build/wrentool fetch wasmtime
          build/wrentool fetch wgpu
          CC=clang build/wrentool build lexbor

      - name: Build (release)
        run: ./build.sh release

      - name: Package
        run: build/wrentool package ${{ inputs.version && format('-Version {0}', inputs.version) || '' }}   # (by hand: the sources' version)

      - name: The packaged executable end to end (wrentool smoke)
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf build/dist/wren-*-linux-x64.tar.gz -C "$RUNNER_TEMP/unpacked"
          ldd "$RUNNER_TEMP"/unpacked/*/wren | grep -v 'linux-vdso\|ld-linux'
          xvfb-run -a build/wrentool smoke "$RUNNER_TEMP"/unpacked/*/wren

      - uses: actions/upload-artifact@v4
        with:
          name: wren-linux-x64
          path: |
            build/dist/wren-*-linux-x64.tar.gz
            build/dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
