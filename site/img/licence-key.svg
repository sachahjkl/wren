<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A golden key whose handle is the head of a wren">
  <defs>
    <!-- brushed gold: darker at the edges, one soft band of light across -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98a2d"/>
      <stop offset="0.22" stop-color="#e9c46a"/>
      <stop offset="0.34" stop-color="#fff2c2"/>
      <stop offset="0.46" stop-color="#e2b94f"/>
      <stop offset="0.72" stop-color="#a97a22"/>
      <stop offset="1" stop-color="#d9ae4a"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1d47e"/>
      <stop offset="0.5" stop-color="#cf9f3a"/>
      <stop offset="1" stop-color="#8f6418"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(1.12) translate(-256 -256) translate(-6 8) rotate(40 256 256)">
    <!-- shaft, collar, bit -->
    <rect x="247" y="176" width="18" height="246" rx="9" fill="url(#goldSide)"/>
    <rect x="237" y="204" width="38" height="12" rx="6" fill="url(#goldSide)"/>
    <path d="M265 356h40a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6h-40z" fill="url(#goldSide)"/>
    <path d="M265 386h28a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6h-28z" fill="url(#goldSide)"/>
    <rect x="247" y="408" width="18" height="18" rx="9" fill="url(#goldSide)"/>
    <rect x="253" y="226" width="3.2" height="150" rx="1.6" fill="#fff8de" opacity="0.7"/>
    <!-- the bow: a wren's head in profile, a thin beak to the left -->
    <path d="M202 118C206 84 236 58 270 60c38 2 62 32 56 68-5 32-34 56-68 56-32 0-58-24-56-66z" fill="url(#gold)"/>
    <path d="M205 112 144 126c26 2 46 8 61 18z" fill="#c99a35"/>
    <!-- the eye, a thin rim of light on the crown -->
    <circle cx="240" cy="114" r="8.5" fill="#3a2508"/>
    <circle cx="243" cy="111" r="2.8" fill="#fff7dc"/>
    <path d="M222 88c16-16 44-22 68-14" fill="none" stroke="#fff6d0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>  </g>
</svg>
