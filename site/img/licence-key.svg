<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A golden key whose handle is the head of a wren">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#4cc2ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#f3c653"/>
      <stop offset="1" stop-color="#a9741a"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8922a"/>
      <stop offset="1" stop-color="#8d5f14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#121212"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 256) scale(1.15) translate(-256 -256) translate(-22 5) rotate(38 256 256)" filter="url(#shadow)">
    <!-- shaft, collar and teeth -->
    <rect x="243" y="205" width="26" height="215" rx="12" fill="url(#gold)"/>
    <rect x="228" y="214" width="56" height="18" rx="9" fill="url(#gold)"/>
    <path d="M269 352h46a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8h-46z" fill="url(#goldDark)"/>
    <path d="M269 388h32a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8h-32z" fill="url(#goldDark)"/>
    <rect x="243" y="404" width="26" height="22" rx="11" fill="url(#gold)"/>
    <!-- the handle: the head of a wren, in profile, beak to the left -->
    <path d="M326 112c0 42-30 92-72 92-30 0-52-22-58-48l-66 8 62-40c4-36 36-62 66-62 38 0 68 20 68 50z" fill="url(#gold)"/>
    <path d="M196 158l-66 8 62-30z" fill="#e0a93a"/>
    <!-- feathers on the cheek and crown -->
    <path d="M252 168c18 6 36 0 48-14" fill="none" stroke="#a9741a" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M262 186c14 4 28-2 38-12" fill="none" stroke="#a9741a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M300 80c12 4 22 12 26 24" fill="none" stroke="#fff3c4" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <!-- eye -->
    <circle cx="240" cy="124" r="13" fill="#2a1a05"/>
    <circle cx="244" cy="120" r="4.5" fill="#fff6d6"/>
    <!-- shine on the shaft -->
    <rect x="250" y="236" width="5" height="150" rx="2.5" fill="#fff8dc" opacity="0.55"/>
  </g>
</svg>
