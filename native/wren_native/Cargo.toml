# The assembly crate of the native/ workspace: the one Rust static library wren.exe links (build\native\wren_native.lib,
# wrentool build native). It has no code of its own: it picks the libraries, and their C functions (#[no_mangle]) are
# exported from it. A program links one Rust static library at most (each carries Rust's standard library).
[package]
name = "wren_native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# the image decoders and WOFF2 (native/media): package images, package webfont
wren_media = { path = "../media" }
# the network stack (native/net): package net, network.backend = rust
wren_net = { path = "../net" }
# WebGL's device side (native/webgl): wgpu and naga on a thread per context: package webgl
wren_webgl = { path = "../webgl" }
# P-521 for crypto.subtle (RustCrypto): package page
wren_crypto = { path = "../crypto" }
# Minimal source-built Wasmtime 49.0.3 C API (cranelift, parallel-compilation, threads, gc, profiling, standalone wat2wasm): package wasm
wren_wasmtime_capi = { path = "../wasmtime_capi" }
# The toolkit's native text backend (Fontations, HarfRust, ICU4X): the toolkit is then built with
# -define:FONT_BACKEND=native -define:FONT_NATIVE_LINK=false. Left out of a WREN_TEXT=dwrite build.
gt_text = { path = "../../ext/gui_toolkit/native/text", optional = true }
# The toolkit's accessibility adapter (AccessKit and its UI Automation adapter: screen readers read the chrome and the
# pages): the toolkit is then built with -define:A11Y_ACCESSKIT=true -define:A11Y_NATIVE_LINK=false.
gt_a11y = { path = "../../ext/gui_toolkit/native/a11y", optional = true }
# No log logger or tracing subscriber is ever installed in Wren: disable both at compile time in release/quick builds so
# log::*/tracing::* call sites, metadata statics, format strings and Debug impls are stripped across all native crates.
log = { version = "=0.4.34", default-features = false, features = ["release_max_level_off"] }
tracing = { version = "=0.1.44", default-features = false, features = ["release_max_level_off"] }

# WebGPU C API for gui_toolkit/render (shares wgpu-core/naga/ash with wren_webgl): Linux (Vulkan + GLES fallback) and Windows WREN_RENDER=wgpu (DX12 + Vulkan).
[target.'cfg(target_os = "windows")'.dependencies]
wren_wgpu_capi = { path = "../wgpu_capi", optional = true, default-features = false, features = ["wgsl", "dx12", "vulkan"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
wren_wgpu_capi = { path = "../wgpu_capi", optional = true, default-features = false, features = ["wgsl", "vulkan", "gles"] }

[features]
text = ["dep:gt_text"]
a11y = ["dep:gt_a11y"]
wgpu_capi = ["dep:wren_wgpu_capi"]
