# Wren's built-in image decoders and WOFF2, a library of the native/ workspace: linked into wren.exe through the
# assembly crate native/wren_native (tools\build_native.ps1 -> build\native\wren_native.lib).
# Every dependency is safe Rust except rav1d's assembly kernels (the same as dav1d's); versions are pinned exactly here
# and by native/Cargo.lock (SHA-256 of every crate), and the build runs with --locked.
[package]
name = "wren_media"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

# Audio decoding (src/media/audio.rs) and output (src/media/aout.rs) are built only where the platform has no native
# media stack of its own: Windows keeps Media Foundation and WASAPI, so these C-bearing crates (Opus' libopus, cpal's
# ALSA) stay out of the Windows build. Symphonia (AAC-LC, MP3, FLAC, Vorbis, PCM) is pure safe Rust; the `opus` crate
# builds Xiph's libopus with cc (no pure-Rust Opus decoder is mature); cpal drives ALSA, which PipeWire and PulseAudio
# serve; libc gives CLOCK_MONOTONIC in the output callback.
[target.'cfg(not(target_os = "windows"))'.dependencies]
symphonia = { version = "=0.5.4", default-features = false, features = ["aac", "mp3", "flac", "vorbis", "pcm"] }
opus = "=0.3.0"
cpal = "=0.15.3"
libc = "=0.2.191"

[dependencies]
# SVG: usvg (parse + simplify) and tiny-skia (rasterise); text with the system's fonts (fontdb), <image> with data: URLs
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# WebP: lossy (VP8), lossless (VP8L), alpha, animation; pure safe Rust
image-webp = "=0.2.4"
# AVIF: container (items, alpha, grid, sequences, colr / irot / imir / clap), safe Rust with fallible allocations
zenavif-parse = "=0.6.2"
enough = "=0.4.5"   # zenavif-parse's cancellation token (Unstoppable)
# AV1: the Rust port of dav1d (dav1d's assembly kernels: NASM at build time)
rav1d = { version = "=1.1.0", default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
# VP9: a from-scratch, clean-room pure-Rust decoder (no C/FFI, no build-time toolchain beyond the Rust compiler), MIT.
# The media player's software VP9 (src/media/vp9_soft.odin): YouTube's high resolutions on a machine without the
# system's VP9 decoder. Runtime-detected AVX2 fast paths and tile-parallel decode inside; its output is bit-exact
# against the official conformance corpus. Pinned exactly and by Cargo.lock.
vp9dec = "=0.1.1"
# Colour management (Firefox's): ICC profiles and CICP to sRGB
qcms = { version = "=0.3.0", default-features = false, features = ["iccv4-enabled"] }
# WOFF2 web fonts (src/woff2.rs): Dropbox's Brotli decompressor, safe Rust (bounds checks kept: no "unsafe" feature)
brotli-decompressor = { version = "=6.1.0", default-features = false, features = ["std"] }

# PNG / APNG, JPEG, GIF, BMP, ICO, TIFF decoding and PNG / JPEG encoding (src/raster.rs), what WIC did: the image crate's
# own BMP / ICO / JPEG encoder, png, zune-jpeg, gif and tiff (safe Rust; png, zune-jpeg and gif are resvg's already)
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff"] }
gif = "=0.14.2"   # raster.rs counts frames and reads the loop count without decoding pixels

[dev-dependencies]
# tests only: outlines of decoded WOFF2 fonts compared with the same fonts served as TrueType (already a dependency of resvg)
skrifa = "=0.44.0"
