# Wren's built-in image decoders, linked statically into wren.exe (tools\build_media.ps1 -> build\media\wren_media.lib).
# Every dependency is safe Rust except rav1d's assembly kernels (the same as dav1d's); versions are pinned exactly here
# and by Cargo.lock (SHA-256 of every crate), and the build runs with --locked.
[package]
name = "wren_media"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
# SVG: usvg (parse + simplify) and tiny-skia (rasterise); text with the system's fonts (fontdb), <image> with data: URLs
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# WebP: lossy (VP8), lossless (VP8L), alpha, animation; pure safe Rust
image-webp = "=0.2.4"
# AVIF: container (items, alpha, grid, sequences, colr / irot / imir / clap), safe Rust with fallible allocations
zenavif-parse = "=0.6.2"
enough = "=0.4.5"   # zenavif-parse's cancellation token (Unstoppable)
# AV1: the Rust port of dav1d (dav1d's assembly kernels: NASM at build time)
rav1d = { version = "=1.1.0", default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
# Colour management (Firefox's): ICC profiles and CICP to sRGB
qcms = { version = "=0.3.0", default-features = false, features = ["iccv4-enabled"] }
# WOFF2 web fonts (src/woff2.rs): Dropbox's Brotli decompressor, safe Rust (bounds checks kept: no "unsafe" feature)
brotli-decompressor = { version = "=6.1.0", default-features = false, features = ["std"] }

# The toolkit's native text backend (Fontations, HarfRust, ICU4X), built into this library when Wren is built with
# WREN_TEXT=native: a program links one Rust static library at most (each carries Rust's standard library). Its gt_*
# functions stay exported; the toolkit is then built with -define:FONT_NATIVE_LINK=false.
gt_text = { path = "../../ext/gui_toolkit/native/text", optional = true }
# The toolkit's accessibility adapter (AccessKit and its UI Automation adapter: screen readers read the chrome and the
# pages), built in for the same reason; the toolkit is then built with -define:A11Y_ACCESSKIT=true
# -define:A11Y_NATIVE_LINK=false.
gt_a11y = { path = "../../ext/gui_toolkit/native/a11y", optional = true }

[features]
text = ["dep:gt_text"]
a11y = ["dep:gt_a11y"]

[dev-dependencies]
# tests only: outlines of decoded WOFF2 fonts compared with the same fonts served as TrueType (already a dependency of resvg)
skrifa = "=0.44.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
panic = "unwind"   # every entry point catches panics: a decoder bug is a broken image, not a dead browser
incremental = false
