# WebGL's device side, a library of the native/ workspace: linked into wren.exe through the assembly crate native/wren_native.
# A context is a thread with a wgpu device of its own in the GPU process, fed with the command buffers of a realm (docs/js/webgl.md).
# GLSL ES goes through src/translate.rs into Vulkan-flavoured GLSL, then naga's front end; wgpu compiles naga's module for
# Direct3D 12 (HLSL, FXC from the system) or Vulkan (SPIR-V). wgpu's GLES and Metal backends are not built.
[package]
name = "wren_webgl"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["glsl-in"] }
pp-rs = "=0.2.1"
pollster = "=0.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "naga-ir", "dx12", "vulkan"] }
# The GPU process: sections, events, the Job object, what the child gives up (src/ipc/sys_windows.rs).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "naga-ir", "vulkan"] }
# The GPU process: memfds, socket pairs, prctl (src/ipc/sys_linux.rs).
libc = "=0.2.191"
