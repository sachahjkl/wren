# WebGL's device side, a library of the native/ workspace: linked into wren.exe through the assembly crate native/wren_native.
# A context is a thread with a wgpu device of its own, fed with the command buffers of a realm (docs/js/webgl.md).
# GLSL ES goes through src/translate.rs into Vulkan-flavoured GLSL, then naga's front end; wgpu compiles naga's module for
# Direct3D 12 (HLSL, FXC from the system) or Vulkan (SPIR-V). wgpu's GLES and Metal backends are not built.
[package]
name = "wren_webgl"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["glsl-in"] }
pp-rs = "=0.2.1"
pollster = "=0.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "naga-ir", "dx12", "vulkan"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "naga-ir", "vulkan"] }
