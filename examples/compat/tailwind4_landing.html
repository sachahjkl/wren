<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Clock-in (fixture)</title>
<link rel="stylesheet" href="tailwind4_landing.css" media="print" onload="this.media='all'">
</head>
<body class="min-h-screen bg-linear-to-br from-blue-50 via-blue-100 to-blue-200 text-slate-900 antialiased">
<div class="mx-auto flex min-h-screen max-w-6xl flex-col px-4">
  <main class="flex flex-1 flex-col items-center gap-8 pt-24">
    <h1 class="flex items-center gap-6">
      <span class="text-8xl leading-none">⌛</span>
      <span class="bg-linear-to-r from-blue-400 to-blue-600 bg-clip-text text-8xl font-black tracking-tight text-transparent drop-shadow-[0_2px_0_white]">Clock-in</span>
    </h1>
    <p class="text-2xl font-medium italic text-slate-600">Votre badgeuse, rien de plus</p>
    <div class="flex flex-wrap justify-center gap-3">
      <button class="rounded-xl bg-emerald-500 px-6 py-3 text-2xl font-semibold text-white shadow-md transition hover:bg-emerald-600 focus-visible:ring-4 focus-visible:ring-emerald-300">Créer un compte</button>
      <button class="rounded-xl bg-linear-to-r from-violet-400 to-violet-600 px-6 py-3 text-2xl font-semibold text-white shadow-md hover:from-violet-500">Essayer la démo</button>
    </div>
    <section class="w-full max-w-3xl rounded-3xl border border-white/60 bg-white p-10 shadow-xl shadow-blue-900/5">
      <h2 class="mb-8 text-2xl font-bold">Connexion à un compte existant</h2>
      <form class="grid grid-cols-[1fr_auto] gap-3 sm:grid-cols-[2fr_1fr]">
        <label class="relative block">
          <input class="w-full rounded-2xl bg-slate-100 px-5 py-4 text-xl placeholder:text-slate-500 focus:outline-2 focus:outline-sky-400" placeholder="Colle ton identifiant">
          <svg class="absolute top-1/2 right-4 size-6 -translate-y-1/2 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        </label>
        <button disabled class="rounded-2xl bg-sky-300 px-6 text-xl font-semibold text-white disabled:opacity-80">Se connecter</button>
      </form>
    </section>
  </main>
  <footer class="mt-auto pb-8 text-slate-600">
    <nav class="mb-6 flex justify-center gap-3 text-lg">
      <a href="#">Mentions légales</a><span aria-hidden="true">•</span><a href="#">Confidentialité</a><span>•</span><a href="#">Cookies</a><span>•</span><a href="#">À propos</a>
    </nav>
    <div class="flex items-center justify-between border-t border-slate-300/60 pt-6 text-lg">
      <span>Clock-in © 2026</span>
      <label class="flex items-center gap-3 font-medium">Langue
        <select class="rounded-xl bg-white px-6 py-3 text-slate-900 shadow-sm"><option>Français</option><option>English</option></select>
      </label>
    </div>
  </footer>
</div>
</body>
</html>
