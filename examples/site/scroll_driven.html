<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A scroll that does not wait</title>
<!--
  Every motion on this page is CSS on a scroll or a view timeline: no scroll listener, no requestAnimationFrame. The one
  script keeps the page's thread busy with tasks of the length chosen in the header, one after the other, and writes
  nothing while it runs: the page's document stays as it was painted.
-->
<style>
  :root {
    color-scheme: light dark;
    --ink: light-dark(#1f2328, #e8e6e3);
    --quiet: light-dark(#5e6670, #a2a8ae);
    --paper: light-dark(#f5f3ee, #16181b);
    --card: light-dark(#fffdf8, #202327);
    --line: light-dark(#d9d5cb, #33373c);
    --wren: #b4532a;
    --sky: #2a7fb4;
    font: 17px/1.55 Georgia, 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); color: var(--ink); }
  body { margin: 0; }

  @keyframes header-shrinks { from { height: 170px; } to { height: 64px; } }
  @keyframes title-shrinks { from { font-size: 46px; } to { font-size: 21px; } }
  @keyframes reading-bar { from { width: 0; } to { width: 100%; } }
  @keyframes shadow-appears { from { box-shadow: 0 0 0 transparent; } to { box-shadow: 0 6px 18px rgb(0 0 0 / .28); } }
  @keyframes dial-turns { to { transform: rotate(360deg); } }
  @keyframes note-widens { from { width: 62%; } to { width: 100%; } }
  @keyframes note-lights {
    entry 0% { background-color: var(--paper); opacity: .25; }
    entry 100% { background-color: var(--card); opacity: 1; }
  }
  @keyframes band-warms { from { background-color: var(--sky); } to { background-color: var(--wren); } }
  @keyframes corner-rounds { from { border-radius: 0; } to { border-radius: 26px; } }

  header {
    position: sticky; top: 0; z-index: 2; overflow: hidden;
    display: flex; align-items: center; gap: 22px; padding: 0 26px;
    background: var(--card); border-bottom: 1px solid var(--line);
    animation: header-shrinks linear both, shadow-appears linear both;
    animation-timeline: scroll(root), scroll(root);
    animation-range: 0 260px, 0 260px;
  }
  h1 {
    margin: 0; font-weight: normal; white-space: nowrap;
    animation: title-shrinks linear both;
    animation-timeline: scroll(root);
    animation-range: 0 260px;
  }
  #bar {
    position: fixed; top: 0; left: 0; height: 4px; z-index: 3; background: var(--wren);
    animation: reading-bar linear both;
    animation-timeline: scroll(root);
  }
  #dial {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--wren);
    animation: dial-turns linear both;
    animation-timeline: scroll(root);
  }
  .load { margin-left: auto; font: 14px/1.3 system-ui, sans-serif; color: var(--quiet); text-align: right; white-space: nowrap; }
  .load select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; }
  #tasks { display: block; font-variant-numeric: tabular-nums; }

  main { max-width: 760px; margin: 0 auto; padding: 36px 20px 120px; }
  .lead { font-size: 21px; color: var(--quiet); }
  .note {
    margin: 26px 0; padding: 20px 24px; border: 1px solid var(--line); border-radius: 8px;
    animation: note-widens linear both, note-lights linear both;
    animation-timeline: view(), view();
    animation-range: entry 0% cover 50%, normal;
  }
  .note h2 { margin: 0 0 6px; font-size: 21px; font-weight: normal; }
  .note p { margin: 0; color: var(--quiet); }
  .band {
    height: 130px; margin: 40px 0; display: grid; place-items: center; color: white; font: 15px system-ui, sans-serif;
    animation: band-warms linear both, corner-rounds linear both;
    animation-timeline: view(), view();
    animation-range: cover 10% cover 90%, cover 10% cover 90%;
  }
  @media (prefers-reduced-motion: reduce) {
    header, h1, #bar, #dial, .note, .band { animation: none; }
    header { height: 64px; }
    h1 { font-size: 21px; }
  }
</style>
<div id="bar"></div>
<header>
  <div id="dial"></div>
  <h1>A scroll that does not wait</h1>
  <label class="load">Tasks on the page's thread
    <select id="load">
      <option value="0">none</option>
      <option value="50">50 ms</option>
      <option value="100">100 ms</option>
      <option value="200" selected>200 ms</option>
      <option value="500">500 ms</option>
    </select>
    <span id="tasks"></span>
  </label>
</header>
<main>
  <p class="lead">Scroll with the page's thread taken: the header, the bar at the top and every note below go on with the wheel, in
    <code>height</code>, <code>font-size</code> and <code>width</code> as well as in <code>transform</code>. Scripts read none of it until their turn.</p>
  <div id="notes"></div>
</main>
<script>
  // The page's words, a note after a note, a band every few of them: enough to scroll through.
  const NOTES = [
    ['The header', 'It shrinks in height and its title in font-size over the first 260 pixels of the scroll: a layout, not a picture.'],
    ['The reading bar', 'Its width is the document\'s scroll progress.'],
    ['This note', 'It widens as it crosses the viewport, and lights up on its way in, by a keyframe at a named range.'],
    ['The dial', 'A transform: the easiest of them, the one every browser can run away from the page.'],
    ['The colours', 'Background colours and corners take no layout. They are painted again in the frames made under a task.'],
    ['What scripts see', 'A task reads the styles, the boxes and the offsets its turn left, and the next frame of the page starts from what the screen shows.'],
  ];
  const REPEAT = 8, BAND_EVERY = 4;
  const notes = document.getElementById('notes');
  for (let i = 0; i < REPEAT * NOTES.length; i++) {
    const [title, words] = NOTES[i % NOTES.length];
    const note = notes.appendChild(document.createElement('section'));
    note.className = 'note';
    note.innerHTML = `<h2>${title}</h2><p>${words}</p>`;
    if (i % BAND_EVERY === BAND_EVERY - 1) {
      const band = notes.appendChild(document.createElement('div'));
      band.className = 'band';
      band.textContent = 'From cold to warm, by the box\'s place in the viewport';
    }
  }

  // The load: tasks back to back, each of the chosen length, with a turn of the loop between two of them.
  const load = document.getElementById('load');
  const tasks = document.getElementById('tasks');
  const REPORT_EVERY_MS = 1000;
  const channel = new MessageChannel();
  let done = 0, shown = performance.now();
  channel.port1.onmessage = () => {
    const ms = Number(load.value);
    const begun = performance.now();
    while (performance.now() - begun < ms) {}
    if (ms > 0) done++;
    // (written at most once a second, between two tasks: a task that changes the document keeps the frames made during it to its last pixels)
    if (begun - shown >= REPORT_EVERY_MS) {
      tasks.textContent = ms > 0 ? `${done} tasks` : '';
      shown = begun;
    }
    if (ms > 0) channel.port2.postMessage(0); else setTimeout(() => channel.port2.postMessage(0), REPORT_EVERY_MS);
  };
  channel.port2.postMessage(0);
</script>
