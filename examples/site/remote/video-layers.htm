<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>video layers</title>
<style>
  html, body { margin: 0; background: #dddddd; }
  /* tools\remote_e2e.ps1 (video layers): a video clipped by a rounded overflow:hidden box, a fixed dialog above it (z-index),
     a rotated half-transparent rounded video, and a control bar over the first one. Probes are at fixed pixels. */
  #round { position: absolute; left: 40px; top: 40px; width: 400px; height: 240px; border-radius: 70px; overflow: hidden; background: #000; }
  #round video { display: block; width: 100%; height: 100%; object-fit: cover; }
  #bar { position: absolute; left: 60px; top: 240px; width: 360px; height: 30px; background: #2255cc; z-index: 5; }
  #dialog { position: fixed; left: 230px; top: 90px; width: 260px; height: 120px; background: #cc3333; z-index: 100; border: 4px solid #111; }
  #tilt { position: absolute; left: 540px; top: 60px; width: 300px; height: 180px; transform: rotate(4deg); opacity: 0.8; border-radius: 40px; overflow: hidden; background: #000; }
  #tilt video { display: block; width: 100%; height: 100%; object-fit: cover; }
</style></head><body>
<div id="round"><video id="v1" src="/video/f/clip.mp4" muted loop autoplay playsinline></video></div>
<div id="bar"></div>
<div id="dialog"></div>
<div id="tilt"><video id="v2" src="/video/f/clip.mp4" muted loop autoplay playsinline></video></div>
<script>
  // a script that keeps the thread busy a few ms every frame, as a player's does: chrome frames get made under it
  (function tick() { const e = performance.now() + 8; while (performance.now() < e) {} requestAnimationFrame(tick); })();
</script>
</body></html>
