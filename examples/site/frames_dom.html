<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The DOM of a same-origin frame</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.4 system-ui, sans-serif; }
  body { margin: 24px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(2, 420px); gap: 18px; }
  figcaption { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  figure { margin: 0; }
  iframe { width: 420px; height: 200px; border: 1px solid #8884; border-radius: 8px; }
  #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; margin-top: 16px; }
</style>
</head>
<body>
<h1>The DOM of a same-origin frame</h1>
<div class="grid">
  <figure><figcaption>Blank frame, written with innerHTML, styled from here</figcaption><iframe id="blank"></iframe></figure>
  <figure><figcaption>document.open / write / close, its script runs there</figcaption><iframe id="written"></iframe></figure>
  <figure><figcaption>Listeners of the parent on a frame's document</figcaption><iframe id="editor"></iframe></figure>
  <figure><figcaption>A frame reads the parent: parent.document, parent.greet()</figcaption><iframe id="child" srcdoc="<!doctype html><body style='font:15px system-ui'><p id=out></p><script>document.getElementById('out').textContent = parent.greet('frame') + ' / parent has ' + parent.document.querySelectorAll('iframe').length + ' frames';</script>"></iframe></figure>
</div>
<div id="log"></div>
<script>
  const log = s => { document.getElementById("log").textContent += s + "\n"; };
  window.greet = who => "hello " + who;

  const blank = document.getElementById("blank").contentDocument;
  blank.body.innerHTML = '<h2 style="color:#0a7;margin:8px">Written by the parent</h2><p style="margin:8px">this text is in the frame</p>';
  blank.body.style.font = "16px system-ui";
  const moved = document.createElement("div");
  moved.textContent = "this element was made in the parent, then moved";
  moved.style.cssText = "margin:8px;padding:8px;background:#ffd;color:#333";
  blank.body.appendChild(moved);
  log("blank: " + blank.querySelector("h2").textContent + "; " + (moved.ownerDocument === blank));

  const written = document.getElementById("written").contentDocument;
  written.open();
  written.write('<!doctype html><body style="font:15px system-ui;background:#eef"><h3>Written</h3><div id=c></div><script>document.getElementById("c").textContent = "script of the frame ran, at " + location.href; parent.greet("x");<\/script>');
  written.close();
  log("written: " + written.getElementById("c").textContent);

  const editor = document.getElementById("editor");
  const ed = editor.contentDocument;
  ed.body.innerHTML = "<p>Click here: <b>the parent</b> hears it.</p>";
  ed.body.style.font = "15px system-ui";
  ed.addEventListener("click", e => log("click in the frame, on " + e.target.tagName + ", heard by the parent"));
  ed.addEventListener("keydown", e => log("key in the frame: " + e.key));
</script>
</body>
</html>
