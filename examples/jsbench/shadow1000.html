<!doctype html>
<meta charset="utf-8">
<title>1000 custom elements with shadow roots</title>
<!-- tools\perf.ps1 scenario js_shadow1000: 1000 custom elements, each with an open shadow root (an adopted constructed
     stylesheet shared by all, a <style> of its own, :host / ::slotted() / ::part() rules, a named slot and the default
     one). Every animation frame toggles a state on 50 hosts (:host(.on), :state(), an attribute their slotted content
     and their parts depend on) and changes the slotted text of 20 others: the restyle and layout of shadow trees. -->
<style>
  body { margin: 0; font: 13px/1.3 system-ui, sans-serif; background: #f4f6fb; }
  #grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; }
  x-card::part(title) { color: #135; }
  x-card[data-hot]::part(title) { color: #b31; }
  x-card span[slot=title] { font-weight: 600; }
</style>
<div id="grid"></div>
<script>
(function () {
  "use strict";
  var N = 1000, grid = document.getElementById("grid"), cards = [];
  var shared = new CSSStyleSheet();
  shared.replaceSync(":host { display: block; width: 112px; padding: 4px; border: 1px solid #ccd; border-radius: 4px; background: #fff; }" +
    ":host(.on) { background: #e8f4ff; border-color: #6ae; } :host(:state(busy)) .bar { width: 100%; }");
  class XCard extends HTMLElement {
    constructor() {
      super();
      this.internals = this.attachInternals();
      var root = this.attachShadow({ mode: "open" });
      root.adoptedStyleSheets = [shared];
      root.innerHTML = "<style>.t { font-size: 12px; } .bar { height: 3px; width: 20%; background: #6ae; } ::slotted(em) { color: #666; }</style>" +
        "<div class=t part=title><slot name=title>untitled</slot></div><slot></slot><div class=bar part=bar></div>";
    }
  }
  customElements.define("x-card", XCard);
  for (var i = 0; i < N; i++) {
    var c = document.createElement("x-card");
    c.innerHTML = "<span slot=title>Card " + i + "</span><em>item " + (i * 7 % 97) + "</em>";
    grid.appendChild(c);
    cards.push(c);
  }
  var frames = 0, t0 = Date.now();
  var schedule = typeof requestAnimationFrame === "function" ? function (f) { requestAnimationFrame(f); } : function (f) { setTimeout(function () { f(Date.now()); }, 16); };
  function frame() {
    var k = frames % 20;
    for (var i = k; i < N; i += 20) {
      var card = cards[i];
      if ((i / 20 | 0) % 2 === frames % 2) { card.classList.toggle("on"); }
      else if (card.internals.states.has("busy")) { card.internals.states.delete("busy"); card.removeAttribute("data-hot"); }
      else { card.internals.states.add("busy"); card.setAttribute("data-hot", ""); }
    }
    for (var j = 0; j < 20; j++) {
      var e = cards[(frames * 37 + j * 53) % N].querySelector("em");
      e.textContent = "item " + (frames + j);
    }
    if (++frames % 180 === 0) { console.log("frames", frames, "in", Date.now() - t0, "ms"); }
    schedule(frame);
  }
  try { schedule(frame); } catch (e) { console.error("shadow1000: no animation frames or timers:", e && e.message); }
})();
</script>
