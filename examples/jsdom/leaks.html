    void d.style.color;
    void d.attributes.length;

    d.appendChild(document.createElement("i"));
    void document.querySelectorAll("p");

  window.keep.appendChild(document.createElement("li"));
  window.keepList = [...window.keep.children].slice(0, 2);
  t("made garbage", true);

done();
